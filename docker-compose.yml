# Yerel geliştirme: `docker compose up -d db` yalnızca veri tabanını açar.
# `docker compose up -d` sunucuyu da derleyip çalıştırır.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kitaplik
      POSTGRES_PASSWORD: kitaplik
      POSTGRES_DB: kitaplik
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kitaplik']
      interval: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://kitaplik:kitaplik@db:5432/kitaplik
      UPLOAD_DIR: /data/uploads
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
